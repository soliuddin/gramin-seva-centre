        <li class="rv" data-i="b1"></li><li class="rv" style="--d:.1s" data-i="b2"></li><li class="rv" style="--d:.2s" data-i="b3"></li><li class="rv" style="--d:.3s" data-i="b4"></li>

  <section class="sec" id="why">
    <div class="wrap">
      <div class="sec-h rv"><span class="eyebrow" data-i="why_e"></span><h2 data-i="why_h"></h2><svg class="alpona" aria-hidden="true"><use href="#alpona"/></svg></div>
      <div class="why">
        <div class="rv left"><span class="badge">₹</span><h3 data-i="why1_t"></h3><p data-i="why1_p"></p></div>
        <div class="rv" style="--d:.12s"><span class="badge">✎</span><h3 data-i="why2_t"></h3><p data-i="why2_p"></p></div>
        <div class="rv right" style="--d:.24s"><span class="badge">⌂</span><h3 data-i="why3_t"></h3><p data-i="why3_p"></p></div>
      </div>
    </div>
  </section>


  <section class="sec alt" id="trust">
    <div class="wrap">
      <div class="sec-h rv"><span class="eyebrow" data-i="trust_e"></span><h2 data-i="trust_h"></h2><svg class="alpona" aria-hidden="true"><use href="#alpona"/></svg></div>

        <div class="tcard rv"><span class="tic">₹</span><h3 data-i="tr1_t"></h3><p data-i="tr1_p"></p></div>
        <div class="tcard rv" style="--d:.07s"><span class="tic">✓</span><h3 data-i="tr2_t"></h3><p data-i="tr2_p"></p></div>
        <div class="tcard rv" style="--d:.14s"><span class="tic">⌂</span><h3 data-i="tr3_t"></h3><p data-i="tr3_p"></p></div>
        <div class="tcard rv" style="--d:.21s"><span class="tic">☎</span><h3 data-i="tr4_t"></h3><p data-i="tr4_p"></p></div>
      </div>
    </div>
  </section>

  <section class="sec" id="contact">
    <div class="wrap">
      <div class="sec-h rv"><span class="eyebrow" data-i="visit_e"></span><h2 data-i="visit_h"></h2><svg class="alpona" aria-hidden="true"><use href="#alpona"/></svg><p data-i="visit_p"></p></div>
      <div class="visit">
        <div class="mapcard rv left">
          <div class="mapframe" id="mapframe"><div class="ph" data-i="map_wait"></div></div>
          <div class="mapinfo">
            <div class="facts">
              <div class="fact full"><span class="eyebrow" data-i="address"></span><p id="v-addr"></p></div>
              <div class="fact"><span class="eyebrow" data-i="hours"></span><p id="v-hours"></p></div>
              <div class="fact" id="v-phone-box"><span class="eyebrow" data-i="phone"></span><a class="val" id="v-phone"></a></div>
            </div>
            <div class="mapbtns">
              <a class="btn primary" id="v-dir" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-pin"/></svg><span data-i="map_dir"></span></a>
              <a class="btn" id="v-map" target="_blank" rel="noopener" data-i="map_open"></a>
              <a class="btn wa" id="v-wa" target="_blank" rel="noopener" hidden><svg aria-hidden="true"><use href="#i-wa"/></svg><span data-i="wa_btn"></span></a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>
  <section class="sec" id="feedback">
    <div class="wrap">
      <div class="sec-h rv"><span class="eyebrow" data-i="fb_e"></span><h2 data-i="fb_h"></h2><svg class="alpona" aria-hidden="true"><use href="#alpona"/></svg><p data-i="fb_p"></p></div>
      <div class="fb-open rv"><a class="btn primary" href="feedback.html"><svg aria-hidden="true"><use href="#i-send"/></svg><span data-i="fb_open"></span></a></div>
    </div>
  </section>
