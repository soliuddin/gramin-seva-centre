<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/ https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://www.gstatic.com/firebasejs/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com https://formspree.io https://*.googleapis.com wss://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net https://www.google.com https://www.gstatic.com https://*.google.com https://*.gstatic.com https://*.recaptcha.net https://*.firebaseapp.com https://apis.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Staff console · Gramin Seva Centre</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="admin.css">
<script src="../assets/theme.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><use href="../assets/icons.svg#i-check"/></svg>

<section id="auth" class="auth" hidden aria-labelledby="au-title">
  <div class="auth-card">
    <div class="logo" aria-hidden="true">GSC</div>
    <h1 id="au-title"></h1>
    <p class="muted" id="au-sub"></p>
    <form id="au-form" autocomplete="off">
      <div id="au-fields"></div>
      <div class="err" id="au-err" role="alert"></div>
      <button type="submit" class="btn pri block" id="au-btn"></button>
    </form>
    <div class="links" id="au-links"></div>
  </div>
</section>

<div class="shell" id="app" hidden>
  <aside class="side" aria-label="Navigation">
    <div class="brand"><div class="logo" aria-hidden="true">GSC</div><div><b>Staff console</b><small id="s-repo"></small></div></div>
    <nav class="nav" id="nav">
      <button type="button" data-view="dash">Dashboard</button>
      <button type="button" data-view="works">Prices and works <span class="cnt" data-cnt="works"></span></button>
      <button type="button" data-view="cats">Cards and categories <span class="cnt" data-cnt="cats"></span></button>
      <button type="button" data-view="notices">Notices and ticker <span class="cnt" data-cnt="notices"></span></button>
      <button type="button" data-view="sections">Homepage sections <span class="cnt" data-cnt="sections"></span></button>
      <button type="button" data-view="shop">Shop details</button>
      <button type="button" data-view="forms">Call-backs and feedback</button>
      <button type="button" data-view="account">Account and connection</button>
    </nav>
    <div class="side-foot">
      <a id="s-site" target="_blank" rel="noopener noreferrer" href="../">Open website</a>
      <button type="button" data-act="theme" id="s-theme">Dark mode</button>
      <button type="button" data-act="lock">Lock console</button>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div class="t"><h1 id="p-title"></h1><p id="p-sub"></p></div>
      <div class="actions">
        <span class="state" id="state" role="status"></span>
        <button type="button" class="btn ghost" data-act="discard" id="btn-discard">Discard</button>
        <button type="button" class="btn pri" data-act="publish" id="btn-publish">Publish</button>
      </div>
    </div>
    <div id="view" aria-live="polite"></div>
  </main>
</div>

<div id="sheetRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="admin.js" defer></script>
<script type="module" src="../assets/fb.js"></script>
</body>
</html>
